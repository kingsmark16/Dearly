name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm -r --if-present run test -- --passWithNoTests

      - name: Build
        run: pnpm build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dearly
          POSTGRES_USER: dearly
          POSTGRES_PASSWORD: dearly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dearly -d dearly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dearly/api db:generate

      - name: Apply database migrations
        run: pnpm --filter @dearly/api db:deploy
        env:
          DATABASE_URL: postgresql://dearly:dearly@127.0.0.1:5432/dearly
          DIRECT_URL: postgresql://dearly:dearly@127.0.0.1:5432/dearly

      - name: Build applications for E2E
        run: pnpm build
        env:
          DEARLY_API_URL: http://127.0.0.1:4000/api/v1
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
          NEXT_PUBLIC_AUTH_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_GOOGLE_SIGN_IN_ENABLED: true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e
        env:
          DEARLY_TEST_DATABASE_URL: postgresql://dearly:dearly@127.0.0.1:5432/dearly

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start local infrastructure
        run: docker compose up --detach --wait

      - name: Show service status
        run: docker compose ps

      - name: Tear down local infrastructure
        if: ${{ always() }}
        run: docker compose down --remove-orphans
